<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeCros · Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Kalam:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .desk { max-width: 980px; padding-top: 48px; }

    .login {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 56px;
      align-items: center;
      min-height: 0;
      padding-top: 44px;
      padding-bottom: 48px;
    }

    .login .wordmark { display: block; font-size: 3.6rem; margin-bottom: 10px; }
    .lede { font-size: 1.05rem; color: var(--ink-2); max-width: 34ch; margin-bottom: 30px; }

    .switch { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; color: var(--ink-2); }
    .switch__btn {
      font: 600 1rem var(--body);
      background: none;
      border: 0;
      padding: 0 0 2px;
      color: var(--ink-2);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .switch__btn:hover { color: var(--ink); }
    .switch__btn.active { color: var(--ink); border-bottom-color: var(--accent); }

    .login label { display: block; font-size: .88rem; font-weight: 600; margin-bottom: 6px; }
    .login .input { margin-bottom: 16px; max-width: 340px; }
    .login .btn { min-width: 150px; margin-top: 4px; }

    .error {
      display: none;
      max-width: 340px;
      color: var(--brick);
      font-size: .9rem;
      margin-bottom: 16px;
    }
    .error.show { display: block; }

    /* the photo, taped onto the page */
    .snap {
      position: relative;
      justify-self: center;
      width: 100%;
      max-width: 340px;
      background: var(--field);
      padding: 12px 12px 8px;
      border: 1px solid var(--rule-2);
      box-shadow: 0 16px 24px -18px rgba(50, 35, 15, .55);
      transform: rotate(2deg);
    }
    .snap::before {
      content: '';
      position: absolute;
      top: -14px;
      left: 50%;
      width: 96px;
      height: 26px;
      transform: translateX(-50%) rotate(-3deg);
      background: rgba(236, 222, 186, .78);
      border: 1px solid rgba(180, 160, 120, .35);
    }
    .snap img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
    .snap figcaption { font-family: var(--hand); color: var(--ink-2); font-size: 1.1rem; padding-top: 6px; }

    @media (max-width: 760px) {
      .desk { padding-top: 20px; }
      .login { grid-template-columns: 1fr; gap: 40px; padding-top: 30px; }
      .login .wordmark { font-size: 3rem; }
      .login .input { max-width: none; }
      .snap { max-width: 240px; }
    }
  </style>
</head>
<body>
<div class="desk">
  <main class="sheet login">
    <section>
      <span class="wordmark">MeCros</span>
      <p class="lede">Lifts, sets and meals, all written down in one place.</p>

      <div class="switch">
        <button type="button" class="switch__btn active" id="loginTab" onclick="showTab('login')">Sign in</button>
        <span>or</span>
        <button type="button" class="switch__btn" id="registerTab" onclick="showTab('register')">make an account</button>
      </div>

      <div id="errorMsg" class="error" role="alert"></div>

      <div id="loginForm">
        <label for="loginUser">Username</label>
        <input id="loginUser" class="input" type="text" autocomplete="username" />

        <label for="loginPass">Password</label>
        <input id="loginPass" class="input" type="password" autocomplete="current-password" />

        <button type="button" class="btn btn--primary" id="loginBtn" onclick="doLogin()">Sign in</button>
      </div>

      <div id="registerForm" style="display:none">
        <label for="regUser">Pick a username</label>
        <input id="regUser" class="input" type="text" autocomplete="username" />

        <label for="regPass">Password</label>
        <input id="regPass" class="input" type="password" placeholder="6 characters or more" autocomplete="new-password" />

        <label for="regPass2">Same password again</label>
        <input id="regPass2" class="input" type="password" autocomplete="new-password" />

        <button type="button" class="btn btn--primary" id="registerBtn" onclick="doRegister()">Create account</button>
      </div>
    </section>

    <figure class="snap">
      <img src="img.jpg" alt="Sliced steak, fried eggs and avocado on a wooden board" />
    </figure>
  </main>

  <footer class="sign">made by rohan · 2026</footer>
</div>

<script>
  // Redirect if already logged in
  if (sessionStorage.getItem('mecros_token')) {
    window.location.href = '/';
  }

  function showTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('loginForm').style.display    = isLogin ? 'block' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none'  : 'block';
    document.getElementById('loginTab').classList.toggle('active', isLogin);
    document.getElementById('registerTab').classList.toggle('active', !isLogin);
    showError('');
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.toggle('show', !!msg);
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.textContent = loading ? 'One sec…' : (btnId === 'loginBtn' ? 'Sign in' : 'Create account');
  }

  async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    if (!username || !password) return showError('Need both a username and a password.');
    setLoading('loginBtn', true);
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || 'Login failed.');
      sessionStorage.setItem('mecros_token',    data.token);
      sessionStorage.setItem('mecros_username', data.username);
      window.location.href = '/';
    } catch {
      showError('Couldn’t reach the server.');
    } finally {
      setLoading('loginBtn', false);
    }
  }

  async function doRegister() {
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value;
    const confirm  = document.getElementById('regPass2').value;
    if (!username || !password || !confirm) return showError('Fill in all three fields.');
    if (password !== confirm) return showError('Those passwords don’t match.');
    setLoading('registerBtn', true);
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || 'Registration failed.');
      sessionStorage.setItem('mecros_token',    data.token);
      sessionStorage.setItem('mecros_username', data.username);
      window.location.href = '/setup.html';
    } catch {
      showError('Couldn’t reach the server.');
    } finally {
      setLoading('registerBtn', false);
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const loginVisible = document.getElementById('loginForm').style.display !== 'none';
    if (loginVisible) doLogin(); else doRegister();
  });
</script>
</body>
</html>
