<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeCros — Sign In</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --surface2:   #22263a;
      --border:     #2e3248;
      --accent:     #6c63ff;
      --danger:     #ff6584;
      --text:       #e8eaf6;
      --text-muted: #8b90a8;
      --radius:     12px;
      --font:       'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      background: url('img.jpg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 32px rgba(0,0,0,.45);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: .25rem;
      letter-spacing: -.02em;
    }
    .logo span { color: var(--accent); }

    .tagline {
      text-align: center;
      color: var(--text-muted);
      font-size: .875rem;
      margin-bottom: 2rem;
    }

    .tabs {
      display: flex;
      background: var(--surface2);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;
      font-family: var(--font);
      background: none;
      border: none;
      color: var(--text-muted);
      padding: .5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: .875rem;
      font-weight: 500;
      transition: background 150ms, color 150ms;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .35rem;
    }

    .input {
      font-family: var(--font);
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .625rem .875rem;
      color: var(--text);
      font-size: .9375rem;
      outline: none;
      margin-bottom: 1rem;
      transition: border-color 150ms, box-shadow 150ms;
    }
    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,.18);
    }
    .input::placeholder { color: var(--text-muted); }

    .input-wrap {
      position: relative;
      margin-bottom: 1rem;
    }
    .input-wrap .input {
      padding-left: 2.5rem;
      margin-bottom: 0;
    }
    .input-icon {
      position: absolute;
      left: .75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
      line-height: 1;
    }

    .btn {
      font-family: var(--font);
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: .7rem;
      color: #fff;
      font-size: .9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms;
      margin-top: .25rem;
    }
    .btn:hover { background: #7b73ff; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }

    .error {
      background: rgba(255,101,132,.12);
      border: 1px solid rgba(255,101,132,.3);
      color: var(--danger);
      border-radius: 8px;
      padding: .625rem .875rem;
      font-size: .875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error.show { display: block; }
    .app-footer {
      position: fixed;
      bottom: .75rem;
      right: 1rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: .7rem;
      letter-spacing: .12em;
      color: rgba(255,255,255,1);
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Me<span>Cros</span></div>
  <p class="tagline">Tracking your progress has never been easier</p>

  <div class="tabs">
    <button type="button" class="tab-btn active" id="loginTab" onclick="showTab('login')">Sign In</button>
    <button type="button" class="tab-btn" id="registerTab" onclick="showTab('register')">Register</button>
  </div>

  <div id="errorMsg" class="error"></div>

  <div id="loginForm">
    <label for="loginUser">Username</label>
    <div class="input-wrap">
      <i class='bx bxs-user input-icon'></i>
      <input id="loginUser" class="input" type="text" placeholder="your username" autocomplete="username" />
    </div>

    <label for="loginPass">Password</label>
    <div class="input-wrap">
      <i class='bx bxs-lock-alt input-icon'></i>
      <input id="loginPass" class="input" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button type="button" class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
  </div>

  <div id="registerForm" style="display:none">
    <label for="regUser">Username</label>
    <div class="input-wrap">
      <i class='bx bxs-user input-icon'></i>
      <input id="regUser" class="input" type="text" placeholder="choose a username" autocomplete="username" />
    </div>

    <label for="regPass">Password</label>
    <div class="input-wrap">
      <i class='bx bxs-lock-alt input-icon'></i>
      <input id="regPass" class="input" type="password" placeholder="at least 6 characters" autocomplete="new-password" />
    </div>

    <label for="regPass2">Confirm Password</label>
    <div class="input-wrap">
      <i class='bx bxs-lock-alt input-icon'></i>
      <input id="regPass2" class="input" type="password" placeholder="repeat password" autocomplete="new-password" />
    </div>

    <button type="button" class="btn" id="registerBtn" onclick="doRegister()">Create Account</button>
  </div>
</div>

<script>
  // Redirect if already logged in
  if (sessionStorage.getItem('mecros_token')) {
    window.location.href = '/';
  }

  function showTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('loginForm').style.display    = isLogin ? 'block' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none'  : 'block';
    document.getElementById('loginTab').classList.toggle('active', isLogin);
    document.getElementById('registerTab').classList.toggle('active', !isLogin);
    showError('');
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.toggle('show', !!msg);
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.textContent = loading ? 'Please wait…' : (btnId === 'loginBtn' ? 'Sign In' : 'Create Account');
  }

  async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    if (!username || !password) return showError('Please fill in all fields.');
    setLoading('loginBtn', true);
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || 'Login failed.');
      sessionStorage.setItem('mecros_token',    data.token);
      sessionStorage.setItem('mecros_username', data.username);
      window.location.href = '/';
    } catch {
      showError('Could not reach the server.');
    } finally {
      setLoading('loginBtn', false);
    }
  }

  async function doRegister() {
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value;
    const confirm  = document.getElementById('regPass2').value;
    if (!username || !password || !confirm) return showError('Please fill in all fields.');
    if (password !== confirm) return showError('Passwords do not match.');
    setLoading('registerBtn', true);
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || 'Registration failed.');
      sessionStorage.setItem('mecros_token',    data.token);
      sessionStorage.setItem('mecros_username', data.username);
      window.location.href = '/setup.html';
    } catch {
      showError('Could not reach the server.');
    } finally {
      setLoading('registerBtn', false);
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const loginVisible = document.getElementById('loginForm').style.display !== 'none';
    if (loginVisible) doLogin(); else doRegister();
  });
</script>
<footer class="app-footer">made by rohan · © 2026</footer>
</body>
</html>
