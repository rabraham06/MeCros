<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeCros · Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Kalam:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .desk { max-width: 760px; }
    .sheet { min-height: 0; }

    .lede { color: var(--ink-2); max-width: 48ch; margin: -14px 0 34px; }

    .part { margin-bottom: 34px; }
    .part > h2 { padding-bottom: 8px; border-bottom: 1.5px solid var(--ink); margin-bottom: 18px; }

    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 22px; }
    .fields .span-2 { grid-column: 1 / -1; }
    .fields label,
    .group-label { display: block; font-size: .88rem; font-weight: 600; margin-bottom: 6px; }
    .fields label small { font-weight: 400; color: var(--ink-2); }
    .height-row { display: flex; gap: 8px; }

    .toggle-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .toggle-btn { flex: 1 1 140px; }
    .toggle-btn .btn-sub { display: block; font-size: .76rem; font-weight: 400; opacity: .8; margin-top: 2px; }

    .error { display: none; color: var(--brick); margin-bottom: 16px; }
    .error.show { display: block; }

    .finish { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
    .finish__hint { font-family: var(--hand); color: var(--ink-2); }

    @media (max-width: 760px) {
      .fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body style="visibility:hidden">
<div class="desk">
  <header class="masthead">
    <span class="wordmark">MeCros</span>
    <p class="masthead__date">page one</p>
  </header>

  <main class="sheet">
    <h1>Before you start</h1>
    <p class="lede">A few numbers so your calorie and protein targets are actually yours. All of it can be changed later in Settings.</p>

    <div id="errorMsg" class="error" role="alert"></div>

    <section class="part">
      <h2>You</h2>
      <div class="fields">
        <div class="span-2">
          <label for="displayName">What should we call you?</label>
          <input id="displayName" class="input" type="text" placeholder="First name" autocomplete="given-name" oninput="recalc()" />
        </div>

        <div>
          <label for="heightFt">Height</label>
          <div class="height-row">
            <select id="heightFt" class="input" onchange="recalc()" aria-label="Height, feet">
              <option value="">ft</option>
              <option value="4">4 ft</option>
              <option value="5">5 ft</option>
              <option value="6">6 ft</option>
              <option value="7">7 ft</option>
            </select>
            <select id="heightIn" class="input" onchange="recalc()" aria-label="Height, inches">
              <option value="">in</option>
              <option value="0">0 in</option>
              <option value="1">1 in</option>
              <option value="2">2 in</option>
              <option value="3">3 in</option>
              <option value="4">4 in</option>
              <option value="5">5 in</option>
              <option value="6">6 in</option>
              <option value="7">7 in</option>
              <option value="8">8 in</option>
              <option value="9">9 in</option>
              <option value="10">10 in</option>
              <option value="11">11 in</option>
            </select>
          </div>
        </div>

        <div>
          <label for="weight">Weight <small>(lbs)</small></label>
          <input id="weight" class="input" type="number" placeholder="180" min="50" max="500" oninput="recalc()" />
        </div>

        <div class="span-2">
          <span class="group-label">Gender</span>
          <div class="toggle-group" id="genderGroup">
            <button type="button" class="settings-toggle toggle-btn active" data-val="male"
                    onclick="selectToggle('genderGroup', this)">Male</button>
            <button type="button" class="settings-toggle toggle-btn" data-val="female"
                    onclick="selectToggle('genderGroup', this)">Female</button>
          </div>
        </div>
      </div>
    </section>

    <section class="part">
      <h2>How much you move</h2>
      <div class="toggle-group" id="activityGroup">
        <button type="button" class="settings-toggle toggle-btn" data-val="sedentary"
                onclick="selectToggle('activityGroup', this)">
          Sedentary
          <span class="btn-sub">Desk job, little exercise</span>
        </button>
        <button type="button" class="settings-toggle toggle-btn" data-val="light"
                onclick="selectToggle('activityGroup', this)">
          Light
          <span class="btn-sub">1–3 workouts a week</span>
        </button>
        <button type="button" class="settings-toggle toggle-btn" data-val="moderate"
                onclick="selectToggle('activityGroup', this)">
          Moderate
          <span class="btn-sub">3–5 workouts a week</span>
        </button>
        <button type="button" class="settings-toggle toggle-btn" data-val="active"
                onclick="selectToggle('activityGroup', this)">
          Very active
          <span class="btn-sub">6–7 workouts a week</span>
        </button>
      </div>
    </section>

    <section class="part">
      <h2>What you’re after</h2>
      <div class="toggle-group" id="goalGroup">
        <button type="button" class="settings-toggle toggle-btn" data-val="bulking"
                onclick="selectToggle('goalGroup', this)">
          Bulking
          <span class="btn-sub">As much muscle as possible</span>
        </button>
        <button type="button" class="settings-toggle toggle-btn" data-val="lean_bulking"
                onclick="selectToggle('goalGroup', this)">
          Lean bulking
          <span class="btn-sub">Muscle, not much fat</span>
        </button>
        <button type="button" class="settings-toggle toggle-btn" data-val="cutting"
                onclick="selectToggle('goalGroup', this)">
          Cutting
          <span class="btn-sub">Drop fat, keep muscle</span>
        </button>
      </div>
    </section>

    <div class="finish">
      <button type="button" class="btn btn--primary" id="saveBtn" onclick="saveProfile()" disabled>Save &amp; open my log</button>
      <span class="finish__hint" id="finishHint">fill in everything above first</span>
    </div>
  </main>

  <footer class="sign">made by rohan · 2026</footer>
</div>

<script>
  const token = sessionStorage.getItem('mecros_token');
  if (!token) { window.location.href = '/login.html'; }
  else {
    fetch('/api/profile', { headers: { Authorization: 'Bearer ' + token } })
      .then(r => r.json())
      .then(p => {
        if (p) {
          sessionStorage.setItem('mecros_has_profile', '1');
          window.location.href = '/';
        } else {
          document.body.style.visibility = 'visible';
        }
      })
      .catch(() => { document.body.style.visibility = 'visible'; });
  }

  const ACTIVITY_MULT = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725 };
  const GOAL_CAL      = { bulking: [300, 500], lean_bulking: [100, 250], cutting: [-600, -350] };
  const GOAL_PROT     = { bulking: [0.7, 0.9], lean_bulking: [0.9, 1.1], cutting: [1.0, 1.3] };

  function selectToggle(groupId, btn) {
    document.querySelectorAll('#' + groupId + ' .toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    recalc();
  }

  function getSelected(groupId) {
    return document.querySelector('#' + groupId + ' .toggle-btn.active')?.dataset.val || null;
  }

  function recalc() {
    const weight    = parseFloat(document.getElementById('weight').value);
    const activity  = getSelected('activityGroup');
    const goal      = getSelected('goalGroup');
    const gender    = getSelected('genderGroup');
    const name      = document.getElementById('displayName').value.trim();
    const ft        = parseFloat(document.getElementById('heightFt').value);
    const inch      = parseFloat(document.getElementById('heightIn').value);
    const hasHeight = !isNaN(ft) && !isNaN(inch);

    const ready = name && hasHeight && weight > 0 && activity && goal && gender;
    document.getElementById('saveBtn').disabled = !ready;
    document.getElementById('finishHint').classList.toggle('hidden', !!ready);
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.toggle('show', !!msg);
  }

  async function saveProfile() {
    const name     = document.getElementById('displayName').value.trim();
    const ft       = parseFloat(document.getElementById('heightFt').value);
    const inch     = parseFloat(document.getElementById('heightIn').value);
    const weight   = parseFloat(document.getElementById('weight').value);
    const activity = getSelected('activityGroup');
    const goal     = getSelected('goalGroup');
    const gender   = getSelected('genderGroup');

    if (!name || isNaN(ft) || isNaN(inch) || !weight || !activity || !goal || !gender) {
      return showError('A few fields are still empty.');
    }

    const height_cm  = ((ft * 12) + inch) * 2.54;
    const weight_kg  = weight / 2.2046;
    const bmr        = gender === 'female'
      ? (10 * weight_kg) + (6.25 * height_cm) - 286
      : (10 * weight_kg) + (6.25 * height_cm) - 120;
    const tdee       = bmr * (ACTIVITY_MULT[activity] || 1.55);
    const [cLo, cHi] = GOAL_CAL[goal]  || [0, 200];
    const [pLo, pHi] = GOAL_PROT[goal] || [0.8, 1.0];
    const daily_calories = Math.round((tdee + cLo + tdee + cHi) / 2);
    const daily_protein  = Math.round(weight * (pLo + pHi) / 2);

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = await fetch('/api/profile/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ display_name: name, height_cm, weight_lbs: weight, activity_level: activity, goal, gender, daily_calories, daily_protein }),
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || 'Failed to save profile.');
      sessionStorage.setItem('mecros_has_profile', '1');
      window.location.href = '/';
    } catch {
      showError('Couldn’t reach the server.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save & open my log';
    }
  }
</script>
</body>
</html>
